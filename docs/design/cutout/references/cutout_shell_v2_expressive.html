<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
.ca{font-family:'Archivo',sans-serif;color:#17150F}
.cm{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;color:#6B6455}
.nv{display:flex;align-items:center;gap:8px;width:calc(100% + 10px);background:transparent;border:none;border-radius:0;color:#9A907A;font-family:'Archivo',sans-serif;font-size:14px;font-weight:600;letter-spacing:-.01em;padding:9px 12px;cursor:pointer;text-align:left}
.nv:hover{color:#E8D9B8}
.nv.on{background:#F04E23;color:#FFF6EE;margin-right:-10px}
.rp{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;background:transparent;color:#6B6455;border:1px dashed #9A907A;border-radius:0;padding:4px 9px;cursor:pointer}
.rp:hover{color:#17150F;border-color:#17150F}
.rp.on{background:#17150F;color:#E8D9B8;border-style:solid;border-color:#17150F}
.perf{height:1px;background:repeating-linear-gradient(90deg,#9A907A 0 5px,transparent 5px 10px)}
.row{padding:11px 2px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;cursor:pointer}
.row:hover{background:#EFE4C9}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border:1px solid #17150F}
.cbtn{font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;background:#F04E23;color:#FFF6EE;border:1px solid #17150F;border-radius:0;padding:7px 12px;cursor:pointer}
.cbtn:hover{background:#D63F17}
.cbtn2{font-family:'Archivo',sans-serif;font-size:12px;font-weight:500;background:transparent;color:#17150F;border:1px dashed #17150F;border-radius:0;padding:6px 11px;cursor:pointer}
.cbtn2:hover{background:#EFE4C9;border-style:solid}
</style>
<h2 class="sr-only">Reworked Cutout app shell with an oversized role hole in the sidebar, perforated dividers, crop marks, and display-size section headers.</h2>
<div style="background:var(--surface-1);border-radius:12px;padding:16px">
<div style="display:flex;min-height:450px;background:#E8D9B8">
<div style="background:#17150F;width:150px;flex-shrink:0;padding:13px 0 12px;display:flex;flex-direction:column">
<div style="padding:0 12px">
<svg viewBox="0 0 620 130" width="100%" aria-hidden="true" style="display:block"><defs><mask id="m2"><rect width="620" height="130" fill="#fff"/><circle cx="279" cy="52" r="17" fill="#000"/><path d="M247 104 C247 79 262 70 279 70 C296 70 311 79 311 104 Z" fill="#000"/></mask></defs>
<text x="0" y="104" font-family="Archivo, sans-serif" font-size="126" font-weight="800" letter-spacing="-6" fill="#E8D9B8" mask="url(#m2)">Cutout</text></svg>
</div>
<div style="margin:12px 12px 4px;background:#2A2619;padding:8px"><svg viewBox="0 0 64 64" width="100%" height="96" aria-hidden="true" id="rail"></svg></div>
<div class="cm" style="padding:0 12px 12px;color:#F0997B" id="railcap"></div>
<div style="padding-left:10px">
<button class="nv on" data-s="tasks"><i class="ti ti-file-description" style="font-size:17px" aria-hidden="true"></i>Tasks</button>
<button class="nv" data-s="people"><i class="ti ti-users" style="font-size:17px" aria-hidden="true"></i>People</button>
<button class="nv" data-s="activity"><i class="ti ti-clock" style="font-size:17px" aria-hidden="true"></i>Activity</button>
</div>
<div style="flex:1"></div>
<div class="cm" style="padding:0 12px;color:#4A463A;line-height:1.7">fuji<br>41,208,663</div>
</div>

<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px 10px">
<div style="display:flex;gap:5px" id="roles"><button class="rp on" data-r="client">client</button><button class="rp" data-r="reviewer">reviewer</button><button class="rp" data-r="collective">collective</button></div>
<span class="cm" id="who" style="color:#17150F"></span>
</div>
<div class="perf" style="margin:0 16px"></div>
<div style="padding:14px 16px 18px;flex:1;position:relative" id="wrap">
<div style="position:absolute;left:8px;top:8px;width:10px;height:10px;border-left:1px solid #9A907A;border-top:1px solid #9A907A"></div>
<div style="position:absolute;right:8px;top:8px;width:10px;height:10px;border-right:1px solid #9A907A;border-top:1px solid #9A907A"></div>
<div style="position:absolute;left:8px;bottom:8px;width:10px;height:10px;border-left:1px solid #9A907A;border-bottom:1px solid #9A907A"></div>
<div style="position:absolute;right:8px;bottom:8px;width:10px;height:10px;border-right:1px solid #9A907A;border-bottom:1px solid #9A907A"></div>
<div id="body"></div>
</div>
</div>
</div>
</div>
<script>
const $=i=>document.getElementById(i);
let role='client',sec='tasks',openRow=null;
const RAIL={client:{svg:'<g fill="none" stroke="#6B6455" stroke-width="2.5" stroke-dasharray="5 4"><circle cx="32" cy="22" r="11"/><path d="M10 58 C10 42 21 36 32 36 C43 36 54 42 54 58 Z"/></g>',cap:'a hole you are filling'},
reviewer:{svg:'<g fill="#E8D9B8"><circle cx="32" cy="22" r="11"/><path d="M10 58 C10 42 21 36 32 36 C43 36 54 42 54 58 Z"/></g><circle cx="32" cy="22" r="6" fill="#2A2619"/>',cap:'you, minus a chad'},
collective:{svg:'<g fill="#E8D9B8"><circle cx="18" cy="24" r="8"/><path d="M4 56 C4 44 11 40 18 40 C25 40 32 44 32 56 Z"/><circle cx="46" cy="24" r="8"/><path d="M32 56 C32 44 39 40 46 40 C53 40 60 44 60 56 Z"/></g>',cap:'people you vouch for'}};
const D={
client:{who:'acme-protocol.eth',
tasks:{h1:'Reviews you',h2:'commissioned.',s:'You see the hole fill. You never see who filled it.',cta:'Post a task',
rows:[{a:'RT-0418',b:'Fee-switch hook change',c:'1,800 USDC · 4 days',t:'Open',x:'3 qualified nearby',act:'View',m:'Listed on Arkiv, expires with the deadline. First valid proof from Sigil Collective takes it.'},
{a:'RT-0411',b:'Oracle failover path',c:'2,400 USDC · 2 days',t:'In progress',x:'Cutout #7',act:'View',m:'They proved a valid, unrevoked credential. Their ID and past reviews stay hidden.'},
{a:'RT-0402',b:'Withdrawal queue accounting',c:'3,000 USDC · today',t:'Sealed',x:'cut to open',act:'Cut open',m:'Encrypted to your key and stored on Swarm. Cutting decrypts it here in your browser.'}]},
people:{h1:'Collectives',h2:'you trust.',s:'You pick whose judgement counts. Their reviewers can claim your tasks.',cta:'Add a collective',
rows:[{a:'SIGIL',b:'Sigil Collective',c:'Solidity 1–3 · 24 credentialed',t:'Accepted',x:'2 tasks',act:'Manage',m:'Publishes status snapshots to Swarm, so your escrow checks revocations against a public record.'},
{a:'ASSAY',b:'Assay Guild',c:'Protocol economics · 11',t:'Accepted',x:'1 task',act:'Manage',m:'Renews every 12 months. A renewal does not change the credential a reviewer already holds.'},
{a:'LUMEN',b:'Lumen Review Co-op',c:'Cryptography · 7',t:'Not used',x:'never accepted',act:'Accept',m:'Adding a collective widens who can claim future tasks. Posted tasks are unaffected.'}]},
activity:{h1:'Everything',h2:'that happened.',s:'One log across your tasks. Onchain events carry a block, the rest do not.',cta:'Export log',
rows:[{a:'09:41',b:'Proof verified, task claimed',c:'RT-0411',t:'Onchain',x:'block 41,208,663',act:'',m:'The chain checked that some holder of a Sigil credential is unrevoked. It learned nothing else.'},
{a:'08:12',b:'Review sealed and stored',c:'RT-0402',t:'Swarm',x:'bzz://4f2a…c19',act:'',m:'Encrypted in the reviewer\u2019s browser before upload. Swarm holds bytes it cannot read.'}]}},
reviewer:{who:'you are Cutout #7',
tasks:{h1:'Tasks you',h2:'qualify for.',s:'Claim with a chad. The client learns a Sigil reviewer took it, nothing more.',cta:'Cut a proof',
rows:[{a:'RT-0418',b:'Fee-switch hook change',c:'1,800 USDC · 4 days',t:'Open',x:'acme-protocol.eth',act:'Claim',m:'Claiming needs a fresh chad. Today that means a local command and a file import.'},
{a:'RT-0411',b:'Oracle failover path',c:'2,400 USDC · 2 days',t:'Yours',x:'draft saved',act:'Submit',m:'Sealed in this browser before it leaves. Revoke you tomorrow and this still gets paid.'},
{a:'RT-0389',b:'Vault share rounding',c:'1,200 USDC · closed',t:'Paid',x:'6 Sep',act:'',m:'Paid to your wallet. The payment is public, the review is not.'}]},
people:{h1:'Your',h2:'credential.',s:'Assessed once, held by you. Cutout never stores it.',cta:'Cut a proof',
rows:[{a:'SIGIL',b:'Solidity, level 3',c:'Sigil Collective · since Mar',t:'Valid',x:'checked 2 min ago',act:'Cut proof',m:'A chad proves it is valid and unrevoked, expires in 24h, and cannot be linked to your other chads.'},
{a:'ASSAY',b:'Protocol economics',c:'Assay Guild · lapsed Feb',t:'Expired',x:'renew to use',act:'Renew',m:'Expired credentials cannot claim. Assay can renew without a fresh assessment.'}]},
activity:{h1:'Your',h2:'history.',s:'Only you see this. No client can reconstruct it from what you proved.',cta:'Export log',
rows:[{a:'09:41',b:'Chad cut and spent',c:'RT-0411',t:'Local',x:'0x9f…3b',act:'',m:'Generated on your machine. The proof left, the credential did not.'},
{a:'6 Sep',b:'Paid',c:'RT-0389 · 1,200 USDC',t:'Onchain',x:'block 41,140,220',act:'',m:'Third client on one credential. No reassessment between them.'}]}},
collective:{who:'Sigil Collective',
tasks:{h1:'Work riding',h2:'on your name.',s:'Tasks your holders claimed. You see the task, never the review.',cta:'Assess someone',
rows:[{a:'RT-0411',b:'Oracle failover path',c:'acme-protocol.eth · 2,400',t:'In progress',x:'a holder',act:'',m:'You can see a holder claimed it. You cannot see which one, and you cannot read the review.'},
{a:'RT-0356',b:'Bridge message ordering',c:'lumen-labs.eth · 4,100',t:'Disputed',x:'needs a ruling',act:'Rule',m:'A dispute is the one time you weigh in on quality. Your ruling releases or refunds escrow.'}]},
people:{h1:'Your',h2:'roster.',s:'Everyone you assessed. Clients check a public record, not you.',cta:'Assess someone',
rows:[{a:'#2',b:'Solidity, level 3',c:'since Mar · 14 reviews',t:'Valid',x:'nothing in flight',act:'Revoke',m:'Revoking blocks new claims from the moment it lands. Nothing already submitted is affected.'},
{a:'#4',b:'Protocol economics',c:'since Jan · 9 reviews',t:'Valid',x:'1 in flight',act:'Revoke',m:'This one has a review awaiting approval. Revoking blocks their next claim, that delivery still pays.'},
{a:'#9',b:'Solidity, level 2',c:'since Nov · 21 reviews',t:'Expiring',x:'12 days left',act:'Renew',m:'Renewing extends the same credential. No reassessment needed.'}]},
activity:{h1:'Status',h2:'feed.',s:'Published to Swarm and Arkiv. Anyone can read it, nobody needs to ask you.',cta:'Export log',
rows:[{a:'11:02',b:'Snapshot published',c:'24 valid · 1 revoked',t:'Swarm',x:'bzz://81ec…7d',act:'',m:'A signed list of statuses. The escrow contract verifies against this, not against you.'},
{a:'Yst',b:'Credential issued',c:'#11 · Solidity, level 2',t:'Onchain',x:'block 41,190,006',act:'',m:'Portable the moment it is issued.'}]}}};
const TS={'In progress':'background:#17150F;color:#E8D9B8','Yours':'background:#17150F;color:#E8D9B8','Sealed':'background:#F04E23;color:#FFF6EE','Paid':'background:#F04E23;color:#FFF6EE','Disputed':'background:#F04E23;color:#FFF6EE','Expiring':'border-color:#8A5A0B;color:#8A5A0B','Expired':'border-color:#8A5A0B;color:#8A5A0B','Not used':'border:1px dashed #9A907A;color:#6B6455','Swarm':'border:1px dashed #9A907A;color:#6B6455','Local':'border:1px dashed #9A907A;color:#6B6455'};
function render(){const d=D[role][sec];$('who').textContent=D[role].who;
$('rail').innerHTML=RAIL[role].svg;$('railcap').textContent=RAIL[role].cap;
$('body').innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px">'
+'<div><div class="ca" style="font-size:31px;font-weight:800;letter-spacing:-1.4px;line-height:1.02">'+d.h1+'<br><span style="color:#F04E23">'+d.h2+'</span></div>'
+'<div class="ca" style="font-size:13px;color:#3D382C;margin-top:6px;max-width:50ch;line-height:1.5">'+d.s+'</div></div>'
+'<button class="cbtn" id="cta">'+d.cta+'</button></div><div class="perf"></div>'
+d.rows.map((r,i)=>'<div class="row" data-i="'+i+'"><span class="cm" style="flex:0 0 46px;color:#17150F">'+r.a+'</span>'
+'<span style="flex:1 1 150px;min-width:0"><span class="ca" style="font-size:14px;font-weight:600;letter-spacing:-.01em;display:block">'+r.b+'</span><span class="cm">'+r.c+'</span></span>'
+'<span class="tag" style="'+(TS[r.t]||'')+'">'+r.t+'</span><span class="cm" style="flex:0 0 auto">'+r.x+'</span>'
+(r.act?'<button class="'+(r.t==='Sealed'?'cbtn':'cbtn2')+'" data-a="'+i+'">'+r.act+'</button>':'')
+(openRow===i?'<div style="flex:1 1 100%"><div class="ca" style="font-size:13px;line-height:1.55;max-width:62ch;padding:2px 0 4px">'+r.m+'</div></div>':'')
+'</div><div class="perf"></div>').join('')
+'<div class="cm" id="msg" style="min-height:15px;margin-top:9px;color:#17150F"></div>';
document.querySelectorAll('.row').forEach(el=>el.onclick=e=>{if(e.target.closest('button'))return;const i=+el.dataset.i;openRow=openRow===i?null:i;render()});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const r=d.rows[+b.dataset.a];
$('msg').textContent=r.t==='Sealed'?'Opens the cut strip. Drag the scissors to decrypt.':r.b+' — '+b.textContent.toLowerCase()+' opens here, in the same chrome.'});
$('cta').onclick=()=>sendPrompt('Show me the Cutout '+d.cta.toLowerCase()+' screen for the '+role+' role')}
document.querySelectorAll('.nv').forEach(b=>b.onclick=()=>{sec=b.dataset.s;openRow=null;document.querySelectorAll('.nv').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelectorAll('.rp').forEach(b=>b.onclick=()=>{role=b.dataset.r;openRow=null;document.querySelectorAll('.rp').forEach(x=>x.classList.toggle('on',x===b));render()});
render();
</script>
