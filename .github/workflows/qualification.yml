name: Verify Deaddrop
on:
  push:
    paths: ['experiments/qualification/**', '.github/workflows/qualification.yml', 'package-lock.json', 'package.json', 'tsconfig.json', 'vite.config.ts', 'scripts/**', 'deployments/**']
  pull_request:
    paths: ['experiments/qualification/**', '.github/workflows/qualification.yml', 'package-lock.json', 'package.json', 'tsconfig.json', 'vite.config.ts', 'scripts/**', 'deployments/**']
  workflow_dispatch:
jobs:
  proof-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.7
          cache-dependency-path: experiments/qualification/prover/go.sum
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: npm ci
      - run: go test -count=1 ./...
        working-directory: experiments/qualification/prover
      - run: sh experiments/qualification/security/run-probes.sh
      - run: forge test --root experiments/qualification/contracts
      - run: node --import tsx --test experiments/qualification/transport/adapters.test.ts experiments/qualification/transport/assignment.test.ts
      - run: npx tsc --ignoreConfig --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node experiments/qualification/transport/*.ts
      - run: node experiments/qualification/security/concurrency-probe.mjs --fixed
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx --test experiments/qualification/pilot/*.test.ts experiments/qualification/pilot/hosting/*.test.ts experiments/qualification/pilot/web/publish-snapshot.test.ts
      - run: node --check experiments/qualification/pilot/deploy-fuji.mjs
      - run: node --input-type=module -e 'await import("./experiments/qualification/pilot/settlement.ts"); await import("./experiments/qualification/pilot/swarm-id.ts")'
      - run: node experiments/qualification/pilot/security-probe.mjs
      - run: node experiments/qualification/pilot/preflight.mjs --self-test
      - run: npx tsc --ignoreConfig --noEmit --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node,vite/client --lib ES2022,DOM experiments/qualification/pilot/*.ts experiments/qualification/pilot/web/main.ts experiments/qualification/pilot/web/boot.ts experiments/qualification/pilot/hosting/*.ts
      - run: |
          node --input-type=module -e 'import {build} from "vite"; await build({configFile:false,root:"experiments/qualification/pilot/web",build:{outDir:"/tmp/review-pass-pilot-build",emptyOutDir:true}})'

      - run: npm run test:browser
